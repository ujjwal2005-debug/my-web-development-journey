<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline vs block</title>
</head>
<body>
    <!-- block element -->
    <h1>Hello World</h1>
    <h1>Ujjwal</h1>

    <!-- block element -->
    <p>Hello World</p>
    <p>Ujjwal</p>

    <!-- iniline element -->
    <div>
        <a href="www.google.com">google me</a>
        <a href="www.facebook.com">facebook me</a>
        <a href="www.youtube.com">youtube me</a>
    </div>
 


    <!-- inline element -->
     <img src="https://www.shutterstock.com/image-photo/macro-closeup-ripe-mango-hanging-260nw-2625659447.jpg" alt="mango" height="50px" width="50px">
     <img src="https://marketplace.canva.com/Pk_Vc/MAFsWnPk_Vc/1/tl/canva-red-apple-fruit-MAFsWnPk_Vc.png" alt="apple" height="50px" width="50px">

     <p>my name is ujjwal</p>
     <hr>
     <p>i am currently persuing btech</p>

     <!-- sub and sup script -->
    <h1>a<sup>2</sup></h1>
    <h1>H<sub>2</sub>O</h1>
</body>
</html>
