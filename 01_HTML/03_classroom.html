<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>List In HTML</title>
    </head>
    <body>
        <h2>List For Cooking</h2>
        <ul>
            <h3>Unordered List</h3>
            <li>Bread</li>
            <li>Jam</li>
            <li>oil</li>
        </ul>
        <ol>
            <h3>Ordered list</h3>
            <li>Bread</li>
            <li>Jam</li>
            <li>oil</li>
        </ol>
        <ol type="A">
            <h3>Ordered list With type Change</h3>
            <li>Bread</li>
            <li>Jam</li>
            <li>oil</li>
        </ol>
    </body>
</html>
