<body>
    <form action="/action">
        <div>

            <input type="text" placeholder="Enter Username" id="Username" name="Username">
        </div>

        <div>
            <label for="Passward">passward :</label>
            <input type="passward" placeholder="Enter Passward" id="Passward" name="Pass">
        </div>

        <div>
            <label for="Age">Age :</label>
            <input type="number" placeholder="Enter Age" id="Age">
        </div>

        <div>
            <label for="Time">Time :</label>
        <input type="time" placeholder="Enter Time" id="Time">
        </div>
        <button>submit</button>
    </form>
