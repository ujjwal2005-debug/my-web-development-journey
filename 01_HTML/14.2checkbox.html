<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/server">
        <input type="checkbox" id="Age" name="Age">
        <label for="Age">I Am 18+</label>
        <div>
            <input type="radio" name="Fruit" id="Apple" value="Apple" >
            <label for="Apple"> Apple</label>
            <input type="radio" name="Fruit" id="Mango" value="Mango" >
            <label for="Mango">Mango</label>
            <input type="radio" name="Fruit" id="Banana" value="Banana" >
            <label for="Banana">Banana</label>
            <input type="radio" name="Fruit" id="lichi" value="Lichi" >
            <label for="lichi">Lichi</label>
        </div>
        <br>
        <div>
            <h2>Choose Your Subjects</h2>
            <input type="checkbox" id="Maths" name="SUBJECTS" value="Maths">
            <label for="Maths">Maths</label>
            <input type="checkbox" id="Science" name="SUBJECTS" value="Science">
            <label for="Science">Science</label>
            <input type="checkbox" id="Commerce" name="SUBJECTS" value="Commerce">
            <label for="Commerce">Commerce</label>
        
        </div>
        <br>

        <div>
            <h2>Choose Your Proffession</h2>
            <select name="Profession" id="Proffesion">
                <option>Choose Your Profession</option>
                <option value="Student">Student</option>
                <option value="Developer">Developer</option>
            </select>
        </div>
        <br>
        <label for="vol">Select Your Volume level</label>
        <input type="Range" id="vol" min="0" max="100" name="vol" step="10">
        <br>

        <label for="feedback">please give your valuable feedback : </label>
        <textarea id="feedback" name="feedback" placeholder="write your feedback here"></textarea>
        <button>submit</button>
    </form>
</body>
</html>
